<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anmelden · Homepage Editor</title>
  <style>
    :root { color-scheme: dark; --bg: #0d1014; --panel: #161a20; --line: #262c35; --text: #e7e9ec; --muted: #8b93a1; --accent: #f5a524; --accent-ink: #1a1205; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(1200px 600px at 20% -10%, #1d2430, var(--bg)); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; display: grid; gap: 14px; box-shadow: 0 20px 60px #0008; }
    .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; }
    .logo { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 55%, #fff), var(--accent) 45%, color-mix(in srgb, var(--accent) 75%, #000)); color: var(--accent-ink); box-shadow: inset 0 1px 0 #fff8, 0 6px 18px color-mix(in srgb, var(--accent) 20%, transparent); }
    h1 { font-size: 18px; margin: 0; } p { margin: 0; color: var(--muted); font-size: 13px; }
    label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
    input { font: inherit; color: var(--text); background: #0f1217; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 11px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
    .err { color: #ff8f8f; background: #3a1d1d; border-radius: 8px; padding: 8px 10px; font-size: 13px; }
    .lang { display: flex; justify-content: flex-end; }
    .lang select { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <div class="brand"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" /><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></svg></span><div><h1>homepage</h1><p data-i18n="Editor · Anmeldung">Editor · Anmeldung</p></div></div>
    <div class="err" id="err" hidden role="alert" data-i18n="Benutzername oder Passwort falsch.">Benutzername oder Passwort falsch.</div>
    <label><span data-i18n="Benutzer">Benutzer</span> <input name="user" autocomplete="username" required autofocus /></label>
    <label><span data-i18n="Passwort">Passwort</span> <input name="password" type="password" autocomplete="current-password" required /></label>
    <button data-i18n="Anmelden">Anmelden</button>
    <div class="lang"><select id="lang" aria-label="Sprache / Language">
      <option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français</option><option value="it">Italiano</option>
    </select></div>
  </form>
  <script>
    if (location.search.includes('err=1')) document.getElementById('err').hidden = false;
    // Same choice as in the editor (localStorage "hpe-lang", see i18n.js); German is the source text.
    const L = {
      en: { 'Anmelden · Homepage Editor': 'Sign in · Homepage Editor', 'Editor · Anmeldung': 'Editor · Sign in', 'Benutzername oder Passwort falsch.': 'Wrong username or password.', Benutzer: 'User', Passwort: 'Password', Anmelden: 'Sign in' },
      fr: { 'Anmelden · Homepage Editor': 'Connexion · Homepage Editor', 'Editor · Anmeldung': 'Éditeur · Connexion', 'Benutzername oder Passwort falsch.': 'Nom d’utilisateur ou mot de passe incorrect.', Benutzer: 'Utilisateur', Passwort: 'Mot de passe', Anmelden: 'Se connecter' },
      it: { 'Anmelden · Homepage Editor': 'Accedi · Homepage Editor', 'Editor · Anmeldung': 'Editor · Accesso', 'Benutzername oder Passwort falsch.': 'Nome utente o password errati.', Benutzer: 'Utente', Passwort: 'Password', Anmelden: 'Accedi' },
    };
    const known = ['de', 'en', 'fr', 'it'];
    const saved = localStorage.getItem('hpe-lang');
    const nav = (navigator.language || '').slice(0, 2).toLowerCase();
    const apply = (lang) => {
      const d = L[lang] || {};
      document.documentElement.lang = lang;
      document.title = d['Anmelden · Homepage Editor'] || 'Anmelden · Homepage Editor';
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = d[el.dataset.i18n] || el.dataset.i18n; });
      document.getElementById('lang').value = lang;
    };
    apply(known.includes(saved) ? saved : known.includes(nav) ? nav : 'en');
    document.getElementById('lang').onchange = (e) => { localStorage.setItem('hpe-lang', e.target.value); apply(e.target.value); };
  </script>
</body>
</html>
